[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "learn-string-matching-algorithm"
version = "0.1.0"
description = "Flask web app comparing string-matching algorithms on Indonesian hospital data."
requires-python = ">=3.9"
dependencies = [
    "Flask==2.2.2",
    "pandas==2.0.3",
    "nltk==3.8",
    "scikit-learn==1.3",
    "fuzzywuzzy==0.18.0",
    "python-Levenshtein==0.21.1",
    "Jinja2==3.0.2",
    "pyjarowinkler==1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.0.280",
]
